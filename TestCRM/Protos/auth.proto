syntax = "proto3";

option csharp_namespace = "AuthService.Protos";

package auth;

service AuthGrpc {
  rpc ValidateToken (ValidateTokenRequest) returns (ValidateTokenResponse);
  rpc GetUserById   (GetUserByIdRequest)   returns (UserResponse);
  rpc GetUserClaims (GetUserClaimsRequest) returns (UserClaimsResponse);
}

// ── ValidateToken ──────────────────────────────────────────────
message ValidateTokenRequest  { string token = 1; }
message ValidateTokenResponse {
  bool   is_valid  = 1;
  int32  user_id   = 2;
  string username  = 3;
  string role      = 4;
  string tenant_id = 5;
}

// ── GetUserById ────────────────────────────────────────────────
message GetUserByIdRequest { int32 id = 1; }
message UserResponse {
  int32  id         = 1;
  string username   = 2;
  string email      = 3;
  string first_name = 4;
  string last_name  = 5;
  string role       = 6;
  string tenant_id  = 7;
  bool   is_active  = 8;
}

// ── GetUserClaims ──────────────────────────────────────────────
message GetUserClaimsRequest  { int32 user_id = 1; }
message UserClaimsResponse    { repeated ClaimDto claims = 1; }
message ClaimDto              { string type = 1; string value = 2; }
